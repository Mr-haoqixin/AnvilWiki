name: Incremental build audit

# Weekly equivalence guard for experimental.incrementalBuild: a build from
# the incremental cache must be byte-identical to a forced full build, or a
# stale cacheKey is shipping pages that should have changed (see
# scripts/check-incremental.mjs and src/lib/build-cache.ts).

on:
  workflow_dispatch:
  schedule:
    # Tuesday 03:30 UTC — offset from Monday's content-pipeline audit.
    - cron: '30 3 * * 2'

permissions:
  contents: read

concurrency:
  group: incremental-audit
  cancel-in-progress: false

jobs:
  equivalence:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5

      - name: Setup pnpm
        uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6
        with:
          run_install: false

      - name: Setup Node
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version-file: '.nvmrc'
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # Restore the same cache the CI gates build writes, so build #1 of the
      # audit actually exercises the incremental path (a cold cache would
      # compare two full builds — trivially equal, guarding nothing).
      - name: Restore Astro incremental build cache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: node_modules/.astro
          key: astro-incremental-${{ hashFiles('pnpm-lock.yaml') }}-${{ github.sha }}
          restore-keys: |
            astro-incremental-${{ hashFiles('pnpm-lock.yaml') }}-
            astro-incremental-

      - name: Cached vs forced build must produce identical dist
        run: pnpm check-incremental
        env:
          SITE_URL: ${{ vars.SITE_URL || 'https://anvil.wiki' }}
